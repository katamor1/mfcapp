name: build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.configuration }} ${{ matrix.target.solution_platform }}
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release
        target:
          - solution_platform: x64
            project_platform: x64
          - solution_platform: x86
            project_platform: Win32

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Enforce C++17 source boundary
        shell: pwsh
        run: ./tools/check-cpp17-source.ps1

      - name: Test comment policy checker
        shell: pwsh
        run: |
          try {
            ./tests/tools/CommentPolicyCheck.Tests.ps1 *>&1 |
              Tee-Object -FilePath comment-policy-test.log
          } catch {
            $_ | Out-String | Tee-Object -FilePath comment-policy-test.log -Append
            throw
          }

      - name: Enforce comment policy
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            $arguments = @(
              "-NoProfile",
              "-File", "./tools/check-comment-policy.ps1",
              "-BaseRef", "${{ github.event.pull_request.base.sha }}",
              "-HeadRef", "${{ github.event.pull_request.head.sha }}"
            )
          } else {
            $base = (& git merge-base HEAD origin/main).Trim()
            if (-not $base) {
              throw "Could not resolve merge-base against origin/main."
            }
            $arguments = @(
              "-NoProfile",
              "-File", "./tools/check-comment-policy.ps1",
              "-BaseRef", $base,
              "-HeadRef", "HEAD"
            )
          }

          & pwsh @arguments *>&1 |
            Tee-Object -FilePath comment-policy-enforcement.log
          $checkExitCode = $LASTEXITCODE
          exit $checkExitCode

      - name: Restore vcpkg dependencies
        shell: pwsh
        run: ./tools/bootstrap-vcpkg.ps1 -Platform "${{ matrix.target.solution_platform }}"

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.Component.MSBuild `
            -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) {
            throw "MSBuild was not found."
          }
          "path=$msbuild" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: |
          $diagnosticLog = "msbuild-${{ matrix.configuration }}-${{ matrix.target.solution_platform }}.log"
          $tailLog = "msbuild-tail-${{ matrix.configuration }}-${{ matrix.target.solution_platform }}.log"
          & "${{ steps.msbuild.outputs.path }}" mfcapp.slnx /m /nologo /verbosity:minimal `
            /fileLogger /fileLoggerParameters:"LogFile=$diagnosticLog;Verbosity=diagnostic" `
            /p:Configuration="${{ matrix.configuration }}" `
            /p:Platform="${{ matrix.target.solution_platform }}" `
            /p:VcpkgRoot="$env:VCPKG_INSTALLATION_ROOT\"
          $buildExitCode = $LASTEXITCODE
          if (Test-Path $diagnosticLog) {
            Get-Content $diagnosticLog -Tail 160 | Set-Content $tailLog
          }
          exit $buildExitCode

      - name: Upload MSBuild diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msbuild-${{ matrix.configuration }}-${{ matrix.target.solution_platform }}
          path: |
            cpp17-violations.txt
            comment-policy-test.log
            comment-policy-enforcement.log
            comment-policy-violations.txt
            msbuild-${{ matrix.configuration }}-${{ matrix.target.solution_platform }}.log
            msbuild-tail-${{ matrix.configuration }}-${{ matrix.target.solution_platform }}.log
          if-no-files-found: warn
          retention-days: 3

      - name: Run tests
        shell: pwsh
        run: |
          $testDirectory = Join-Path $PWD "out\${{ matrix.target.project_platform }}\${{ matrix.configuration }}"
          $tests = @(
            "ShelfManager.Domain.Tests.exe",
            "ShelfManager.Application.Tests.exe",
            "ShelfManager.Infrastructure.Com.Tests.exe",
            "ShelfManager.Presentation.Tests.exe"
          )
          foreach ($test in $tests) {
            $path = Join-Path $testDirectory $test
            if (-not (Test-Path $path)) {
              throw "Missing test executable: $path"
            }
            & $path
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run MFC smoke test
        shell: pwsh
        run: |
          $outputDirectory = Join-Path $PWD "out\${{ matrix.target.project_platform }}\${{ matrix.configuration }}"
          $application = Join-Path $outputDirectory "mfcapp.exe"
          $mockCsv = Join-Path $PWD "config\mock\machine-responses.csv"
          if (-not (Test-Path $application -PathType Leaf)) {
            throw "Missing MFC executable: $application"
          }
          if (-not (Test-Path $mockCsv -PathType Leaf)) {
            throw "Missing mock CSV: $mockCsv"
          }
          & $application "--mock-csv=$mockCsv" "--smoke-exit-ms=1500"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
