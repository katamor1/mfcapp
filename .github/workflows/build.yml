name: build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.configuration }} ${{ matrix.target.solution_platform }}
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release
        target:
          - solution_platform: x64
            project_platform: x64
          - solution_platform: x86
            project_platform: Win32

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enforce C++17 source boundary
        shell: pwsh
        run: ./tools/check-cpp17-source.ps1

      - name: Restore vcpkg dependencies
        shell: pwsh
        run: ./tools/bootstrap-vcpkg.ps1 -Platform "${{ matrix.target.solution_platform }}"

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.Component.MSBuild `
            -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) {
            throw "MSBuild was not found."
          }
          "path=$msbuild" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: |
          $diagnosticLog = "msbuild-${{ matrix.configuration }}-${{ matrix.target.solution_platform }}.log"
          $tailLog = "msbuild-tail-${{ matrix.configuration }}-${{ matrix.target.solution_platform }}.log"
          & "${{ steps.msbuild.outputs.path }}" mfcapp.slnx /m /nologo /verbosity:minimal `
            /fileLogger /fileLoggerParameters:"LogFile=$diagnosticLog;Verbosity=diagnostic" `
            /p:Configuration="${{ matrix.configuration }}" `
            /p:Platform="${{ matrix.target.solution_platform }}" `
            /p:VcpkgRoot="$env:VCPKG_INSTALLATION_ROOT\"
          $buildExitCode = $LASTEXITCODE
          if (Test-Path $diagnosticLog) {
            Get-Content $diagnosticLog -Tail 160 | Set-Content $tailLog
          }
          exit $buildExitCode

      - name: Upload MSBuild diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msbuild-${{ matrix.configuration }}-${{ matrix.target.solution_platform }}
          path: |
            cpp17-violations.txt
            msbuild-${{ matrix.configuration }}-${{ matrix.target.solution_platform }}.log
            msbuild-tail-${{ matrix.configuration }}-${{ matrix.target.solution_platform }}.log
          if-no-files-found: warn
          retention-days: 3

      - name: Run tests
        shell: pwsh
        run: |
          $testDirectory = Join-Path $PWD "out\${{ matrix.target.project_platform }}\${{ matrix.configuration }}"
          $tests = @(
            "ShelfManager.Domain.Tests.exe",
            "ShelfManager.Application.Tests.exe",
            "ShelfManager.Infrastructure.Com.Tests.exe",
            "ShelfManager.Presentation.Tests.exe"
          )
          foreach ($test in $tests) {
            $path = Join-Path $testDirectory $test
            if (-not (Test-Path $path)) {
              throw "Missing test executable: $path"
            }
            & $path
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
